<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa del Desafío Panamericano</title>
    <!-- Cargamos los estilos de Leaflet para el mapa auténtico -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: sans-serif;
            background-color: #121214;
            color: #ffffff;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 85%;
        }
        #panel-info {
            height: 15%;
            background-color: #1e1e24;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-top: 2px solid #34495e;
            padding: 10px;
            box-sizing: border-box;
        }
        h1 { margin: 0; font-size: 1.2rem; color: #00ffcc; text-transform: uppercase; }
        p { margin: 5px 0 0 0; font-size: 1rem; color: #a0a0b0; }
        .resaltado { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Contenedor donde se dibuja el mapa real -->
    <div id="map"></div>

    <!-- Panel inferior con tus datos reales -->
    <div id="panel-info">
        <h1>Desafío Panamericana Real</h1>
        <p>Progreso acumulado: <span class="resaltado">39,88 km</span> de 24.000 km | Avanzando por Dalton Highway (Alaska)</p>
    </div>

    <!-- Cargamos el motor del mapa Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Inicializar el mapa centrado en el continente americano
        var map = L.map('map').setView([20.0, -95.0], 3);

        // 2. Cargar las capas de mapas satelitales/callejeros auténticos de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Coordenadas geográficas auténticas de los puntos clave de la Ruta Panamericana
        var coordPrudhoeBay = [70.1948, -148.4230];  // Inicio real en Alaska
        var coordFairbanks   = [64.8378, -147.7164];  // Alaska central
        var coordWhitehorse  = [60.7212, -135.0568];  // Canadá (Yukón)
        var coordEdmonton    = [53.5461, -113.4937];  // Canadá (Alberta)
        var coordLaredo      = [27.5036, -99.5076];   // Frontera EE.UU. - México
        var coordMexicoCity  = [19.4326, -99.1332];   // México DF
        var coordPanamaCity  = [8.9824, -79.5199];    // Panamá (Fin tramo Norte)
        var coordTurbo       = [8.0964, -76.7294];    // Colombia (Inicio tramo Sur)
        var coordLima        = [-12.0464, -77.0428];  // Perú
        var coordSantiago    = [-33.4489, -70.6693];  // Chile
        var coordUshuaia     = [-54.8019, -68.3030];  // Fin del mundo (Argentina)

        // 3. Trazado de la Carretera Panamericana completa (LÍNEA ROJA)
        var rutaPanamericana = [
            coordPrudhoeBay, coordFairbanks, coordWhitehorse, coordEdmonton, 
            coordLaredo, coordMexicoCity, coordPanamaCity, 
            coordTurbo, coordLima, coordSantiago, coordUshuaia
        ];
        
        L.polyline(rutaPanamericana, {
            color: 'red',
            weight: 4,
            opacity: 0.7
        }).addTo(map);

        // 4. Tu geoposicionamiento auténtico actual (LÍNEA VERDE)
        // Coordenadas calculadas exactamente a 39,88 km al sur de Prudhoe Bay siguiendo el trazado real de la Dalton Highway
        var tuPosicionActual = [69.8752, -148.6521]; 

        var tuProgresoReal = [
            coordPrudhoeBay,
            tuPosicionActual
        ];

        L.polyline(tuProgresoReal, {
            color: '#2ecc71',
            weight: 6,
            opacity: 1.0
        }).addTo(map);

        // 5. Añadir marcadores visuales en los dos extremos para tener la referencia clara
        L.marker(coordPrudhoeBay).addTo(map).bindPopup("<b>Inicio: Prudhoe Bay (Alaska)</b>").openPopup();
        L.marker(coordUshuaia).addTo(map).bindPopup("<b>Meta: Ushuaia (Argentina)</b>");
        L.marker(tuPosicionActual).addTo(map).bindPopup("<b>Tú estás aquí: Km 39,88</b>");

        // Centrar automáticamente la vista del mapa en tu zona actual de marcha al cargar
        map.setView(tuPosicionActual, 8);
    </script>
</body>
</html>
